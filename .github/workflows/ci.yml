name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, testes e builds
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build de produção (Vercel / modo servidor)
        run: npm run build
      - name: Build estático (GitHub Pages / modo demonstrativo)
        run: npm run build:pages
